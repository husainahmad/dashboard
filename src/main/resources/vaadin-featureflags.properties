# Server-side feature flags
# Neither experimental feature is used by this application:
#  - Web Push API: real-time updates happen over WebSocket/Long-Polling (@Push), not Web Push.
#  - Form Filler add-on: not referenced anywhere in the codebase.
# Flags are kept explicit (false) so the build does not pull in unused experimental code.

# Web Push API
com.vaadin.experimental.webPush=false
# Form Filler Add-on
com.vaadin.experimental.formFillerAddon=false
